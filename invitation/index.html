<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#5C1620">

  <!-- Link preview (WhatsApp etc. read only this file, not the JS) -->
  <title>دعوة زفاف خضر وأمل</title>
  <meta name="description" content="يسرّنا دعوتكم لحضور حفل زفاف خضر وأمل">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="ar_SA">
  <meta property="og:title" content="دعوة زفاف خضر وأمل">
  <meta property="og:description" content="[التاريخ] — [اسم القاعة]، [المدينة]">
  <!-- TODO: add a 1200×630 preview image, then uncomment:
  <meta property="og:image" content="https://YOUR-DOMAIN/og-image.jpg"> -->

  <style>
    html, body { margin: 0; min-height: 100%; background: #5C1620; }
  </style>

  <script>
    /* ============================================================
       Entry point. Picks the design from ?intro and loads it here,
       so the address stays index.html?intro=…
         ?intro=2  → curtain.html (garmasees curtain)   ← default
         ?intro=4  → smoke.html   (bakhoor smoke)
         anything else / missing → curtain.html
       ============================================================ */
    (function () {
      var PAGES = { "2": "curtain.html", "4": "smoke.html" };
      var requested = new URLSearchParams(location.search).get("intro");
      var page = PAGES.hasOwnProperty(requested) ? PAGES[requested] : PAGES["2"];

      if (page === "smoke.html") document.documentElement.style.background = "#160709";

      fetch(page, { cache: "no-cache" })
        .then(function (res) {
          if (!res.ok) throw new Error(res.status);
          return res.text();
        })
        .then(function (html) {
          // Replace this document with the chosen design; the URL stays the same.
          document.open();
          document.write(html);
          document.close();
        })
        .catch(function () {
          // If loading in place fails (e.g. opened from disk), go to the page directly.
          location.replace(page + location.hash);
        });
    })();
  </script>
</head>
<body>
  <noscript>
    <p style="font-family:serif;color:#FBF6EC;text-align:center;padding:40px 16px">
      <a href="curtain.html" style="color:#D9BE86">افتح الدعوة</a>
    </p>
  </noscript>
</body>
</html>
